<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a23] text-white">

    <!-- Sidebar -->
    <div class="flex">
        <aside class="w-64 bg-[#0a0a30] text-re min-h-screen p-5">
            <h2 class="text-2xl font-bold mb-8">📊 Dashboard</h2>
            <ul class="space-y-4">
                <li><a href="index.html" class="block py-2 hover:bg-cyan-800 rounded-lg px-3">🏠 Portfolio</a></li>
                <li><a href="projects.html" class="block py-2 hover:bg-cyan-800 rounded-lg px-3">📂 Projects</a></li>
                <li><a href="index.html#about" class="block py-2 hover:bg-cyan-800 rounded-lg px-3">📊 About</a></li>
                <li><a href="index.html#contact" class="block py-2 hover:bg-cyan-800 rounded-lg px-3">📞Contact</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <h1 class="text-3xl font-bold text-cyan-400 mb-6">Welcome to Your Dashboard</h1>

            <!-- Stats Section -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Projects -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-md text-center">
                    <h3 class="text-xl font-semibold text-gray-300">📂 Total Projects</h3>
                    <p class="text-4xl font-bold text-cyan-400">6</p>
                </div>

                <!-- Skill Progress -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-md text-center">
                    <h3 class="text-xl font-semibold text-gray-300">🔥 Skill Level</h3>
                    <p class="text-4xl font-bold text-cyan-400">85%</p>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="mt-10 bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-semibold text-cyan-400 mb-4">📊 Skills Breakdown</h2>
                <canvas id="skillsChart"></canvas>
            </div>
        </main>
    </div>

    <!-- Chart.js Script -->
    <script>
        const ctx = document.getElementById('skillsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['HTML', 'CSS', 'JavaScript', 'Python', 'React', 'Cybersecurity'],
                datasets: [{
                    label: 'Skill Level (%)',
                    data: [90, 85, 80, 75, 70, 85],
                    backgroundColor: 'rgba(34, 211, 238, 0.7)',
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>
</body>
</html>
